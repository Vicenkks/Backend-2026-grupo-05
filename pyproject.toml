[project]
name = "desarrollo-back-end"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "annan-7", email = "annan@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.16.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.5",
    "pydantic>=2.13.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
